ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ tn.pcecom.ApplicationKt.module ]
  }
}

db {
  url = "jdbc:postgresql://localhost:5432/pcecom"
  url = ${?DB_URL}
  user = "pcecom"
  user = ${?DB_USER}
  password = "pcecom"
  password = ${?DB_PASSWORD}
}

jwt {
  secret = "change-me-in-production"
  secret = ${?JWT_SECRET}
  issuer = "pc-ecom"
  audience = "pc-ecom-admin"
  expiresHours = 12
}

minio {
  endpoint = "http://localhost:9000"
  endpoint = ${?MINIO_ENDPOINT}
  accessKey = "minioadmin"
  accessKey = ${?MINIO_ACCESS_KEY}
  secretKey = "minioadmin"
  secretKey = ${?MINIO_SECRET_KEY}
  bucket = "products"
  bucket = ${?MINIO_BUCKET}
  # Public base URL used in image links returned by the API
  publicUrl = "http://localhost:9000/products"
  publicUrl = ${?MINIO_PUBLIC_URL}
}

# First admin account, created on startup only if no admin exists
admin {
  email = ${?ADMIN_EMAIL}
  password = ${?ADMIN_PASSWORD}
}

cors {
  # Comma-separated list, e.g. "localhost:5173,admin.store.tn"
  origins = "localhost:5173,localhost:5174"
  origins = ${?CORS_ORIGINS}
}
